name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Version Information ==="
          java -version
          echo "JAVA_HOME is set to: $JAVA_HOME"
          
          JAVA_VER=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          echo "Detected full Java version string: $JAVA_VER"
          
          if [ -z "$JAVA_VER" ]; then
            echo "Error: Could not detect Java version."
            exit 1
          fi
          
          MAJOR_VER=$(echo "$JAVA_VER" | awk -F '.' '{if ($1 == "1") print $2; else print $1}')
          echo "Detected Java major version: $MAJOR_VER"
          
          if [ "$MAJOR_VER" -lt 17 ]; then
            echo "Error: Java major version must be 17 or higher. Found: $MAJOR_VER"
            exit 1
          fi
          echo "Java 17+ environment verified successfully."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists in workspace."
          else
            echo "Generating temporary debug keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          
          if [ ! -f "./debug.keystore" ]; then
            echo "Error: Failed to create ./debug.keystore"
            exit 1
          fi
          echo "Debug keystore is ready."

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK output
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Error: Expected debug APK not found at $EXPECTED_APK"
            echo "Listing files under app/build/outputs/apk if directory exists:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -name "*.apk" -type f
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          
          if [ ! -s "$EXPECTED_APK" ]; then
            echo "Error: $EXPECTED_APK is empty."
            exit 1
          fi
          
          case "$EXPECTED_APK" in
            *.apk) ;;
            *) echo "Error: File does not have .apk extension"; exit 1 ;;
          esac
          
          echo "Verified debug APK exists: $EXPECTED_APK ($(stat -c%s "$EXPECTED_APK") bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          REPO_RAW="${{ github.repository }}"
          REPO_NAME=$(basename "$REPO_RAW" | tr -cd 'a-zA-Z0-9._-')
          if [ -z "$REPO_NAME" ]; then
            REPO_NAME="android-app"
          fi
          
          ASSET_NAME="${REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          TEMP_DIR=$(mktemp -d -t apk-release-XXXXXX)
          DEST_PATH="${TEMP_DIR}/${ASSET_NAME}"
          
          cp "app/build/outputs/apk/debug/app-debug.apk" "$DEST_PATH"
          
          if [ ! -s "$DEST_PATH" ]; then
            echo "Error: Failed to copy or prepare release asset at $DEST_PATH"
            exit 1
          fi
          
          echo "asset_path=$DEST_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: $DEST_PATH ($ASSET_NAME)"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Checking GitHub CLI..."
          gh --version
          
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Release asset not found or empty: $ASSET_PATH"
            exit 1
          fi
          
          case "$ASSET_PATH" in
            *.apk) ;;
            *) echo "Error: Release asset must be an .apk file"; exit 1 ;;
          esac
          
          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Debug APK Build #${{ github.run_number }}"
          
          NOTES=$(cat <<EOF
          ### Automated Debug APK Build
          
          - **Build Run**: #${{ github.run_number }} (Attempt: ${{ github.run_attempt }})
          - **Commit SHA**: \`${{ github.sha }}\`
          - **Built By**: GitHub Actions
          
          > ⚠️ **Notice**: This is an automatically generated debug APK intended solely for testing and development. It is **not** a Play Store production release and is signed only with a temporary debug keystore.
          EOF
          )
          
          echo "Creating GitHub Release with tag '$TAG'..."
          gh release create "$TAG" "$ASSET_PATH" \
            --target "${{ github.sha }}" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          PUBLISH_OUTCOME="${{ steps.publish_release.outcome }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          
          echo "=== Workflow Summary Report ==="
          
          if [ "$PUBLISH_OUTCOME" = "success" ]; then
            RELEASE_URL=$(gh release view "$TAG" --json url -q .url 2>/dev/null || echo "https://github.com/${{ github.repository }}/releases/tag/$TAG")
            echo "GitHub Release published successfully!"
            echo "Release Tag: $TAG"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "Release URL: $RELEASE_URL"
            echo "APK Asset Name: $ASSET_NAME"
            
            {
              echo "## 📱 Debug APK Build & Release Summary"
              echo ""
              echo "✅ **Build Succeeded**: Debug APK was built and verified successfully."
              echo "🎉 **GitHub Release Published**: The APK is directly available under GitHub Releases."
              echo ""
              echo "- **Release Page**: [$TAG]($RELEASE_URL)"
              echo "- **Direct Download Asset**: \`$ASSET_NAME\`"
              echo "- **Actions Artifact**: \`app-debug-apk\` (available in the Summary tab as backup)"
              echo ""
              echo "You can download the \`.apk\` directly from the **Assets** section on the release page."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing did not succeed or was skipped."
            echo "The debug APK was built successfully and uploaded as GitHub Actions artifact 'app-debug-apk'."
            
            {
              echo "## 📱 Debug APK Build Summary"
              echo ""
              echo "✅ **Build Succeeded**: Debug APK was built successfully."
              echo "⚠️ **GitHub Release Notice**: Release publishing did not complete, but your APK is safely saved."
              echo ""
              echo "- **Backup Download**: Download the \`app-debug-apk\` artifact from the **Artifacts** section at the bottom of this Actions run summary."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
